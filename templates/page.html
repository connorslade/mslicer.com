{% extends "base.html" %}
{% import "util.html" as util %}

{% block header %}
    <link rel="stylesheet" href="/page.css" />
    <meta name="description" content="{{ page.description }}" />
    <meta property="og:description" content="{{ page.description }}" />
    <meta name="twitter:description" content="{{ page.description }}" />

    <meta property="og:title" content="{{ page.title }}" />
    <meta name="twitter:title" content="{{ page.title }} &mdash; mslicer" />
    <title>{{ page.title }} &mdash; mslicer</title>
{% endblock header %}


{% block content %}
    <div class="heading">
        <h1>{{ page.title }}</h1>
        {% if page.date %}
            <p><span title="To be considered updated, a document must have a meaningful change in it's content. Not just fixing a typo, or updating the formatting.">Updated</span> {{ util::format_date(date=page.date) }}</p>
        {% endif %}
    </div>

    {{ page.content | safe}}
{% endblock content %}
